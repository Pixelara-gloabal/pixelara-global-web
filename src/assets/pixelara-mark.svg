<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="pg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="pg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Aura Shadow -->
  <path
    d="M38 30 V130 M38 30 H65 C80 30 92 42 92 57 C92 72 80 84 65 84 H38 M102 46 C128 46 148 66 148 93 C148 120 128 140 102 140 C76 140 68 122 68 108 M100 96 H144"
    stroke="url(#pg-glow)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Crisp Vector PG Lines matching logo design -->
  <!-- 'P' stroke -->
  <path
    d="M40 30 V130"
    stroke="url(#pg-grad)"
    stroke-width="14"
    stroke-linecap="round"
  />
  <path
    d="M40 30 H64 C78 30 88 40 88 54 C88 68 78 78 64 78 H40"
    stroke="url(#pg-grad)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 'G' stroke -->
  <path
    d="M102 46 C126 46 144 65 144 91 C144 117 125 136 100 136 C76 136 66 118 66 106 C66 94 76 80 100 80 H136"
    stroke="url(#pg-grad)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
